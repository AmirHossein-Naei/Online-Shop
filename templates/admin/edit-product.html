{% extends 'base.html' %}
{% block haeder %}
    <title>ویرایش محصول {{ product.id }}</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='css/bootstrap.rtl.min.css') }}" />
{% endblock %}
{% block body %}

    {% include 'part/header.html' %}


    <section class="simple-box big">

        <img style="width: 100px;margin: auto;display: block;" src="{{ url_for('static', filename='cover/'+product.id|string+".jpg") }}">
        <form action="#" method="post" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <input type="file" name="cover">
            <input type="text" name="name" value="{{ product.name }}" placeholder="نام محصول">
            <textarea name="description" placeholder="توضیحات">{{ product.description }}</textarea>
            <input type="number" value="{{ product.price }}" name="price" placeholder="قیمت محصول">
            <div class="form-check form-switch d-flex justify-content-center align-items-center gap-1 mb-2">
                <input class="form-check-input m-0" value="1" id="active" type="checkbox" name="active" role="switch"
                    {{ "checked" if product.active == 1 }}>
                <label class="form-check-label" for="active">موجود</label>
            </div>
            <input type="submit" value="ثبت تغییرات">
        </form>

    </section>

{% endblock %}
